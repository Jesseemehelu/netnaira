<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Netnaira — Signing you in</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      font-family: -apple-system, sans-serif;
      color: #fff;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #4f9dff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { margin-top: 20px; font-size: 15px; opacity: .8; }
    .error { color: #ff6b6b; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Authenticating with Telegram…</div>

  <script>
    const tg = window.Telegram?.WebApp;

    async function authenticate() {
      // Must be opened as a Telegram Mini App — initData only exists there.
      if (!tg || !tg.initData) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").innerHTML =
          '<div class="error">Please open this app from the Telegram bot, not a regular browser link.</div>';
        return;
      }

      tg.ready();
      tg.expand();

      try {
        const res = await fetch("/api/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            initData: tg.initData,
            ref: tg.initDataUnsafe?.start_param
              || new URLSearchParams(location.search).get("ref")
              || null
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("msg").innerHTML =
            `<div class="error">${data.message || "Authentication failed."}</div>`;
          return;
        }

        document.getElementById("msg").textContent = "Welcome! Redirecting…";
        setTimeout(() => {
          location.href = "/dashboard.html";
        }, 600);

      } catch (err) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").innerHTML =
          '<div class="error">Network error. Please try again.</div>';
      }
    }

    authenticate();
  </script>
</body>
</html>
