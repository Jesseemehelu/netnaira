<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Netnaira — Signing you in</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  /* Telegram Mini App: open fullscreen on phones and keep it that way */
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg || !tg.platform || tg.platform === "unknown") return; /* normal browser: do nothing */

    function has(v) { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } }

    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}

    /* scrolling / swiping down must never close or minimise the app */
    if (has("7.7")) { try { tg.disableVerticalSwipes(); } catch (e) {} }

    /* match Telegram's own bars to the page so nothing flashes white */
    if (has("6.9")) { try { tg.setHeaderColor("#0f1115"); tg.setBackgroundColor("#0f1115"); } catch (e) {} }
    if (has("7.10")) { try { tg.setBottomBarColor("#0f1115"); } catch (e) {} }

    /* fullscreen exists from Bot API 8.0 and is meant for phones */
    if (has("8.0") && /^(android|ios)/.test(tg.platform) && !tg.isFullscreen) {
      try { tg.requestFullscreen(); } catch (e) {}
    }
  })();
  </script>

  <style>
    /* ---- Telegram fullscreen safe areas ----
       In fullscreen, Telegram draws its own buttons (close / menu) over the top of
       the page and the phone's home bar sits at the bottom. These give us the room
       to keep content clear of both. Outside fullscreen they are 0. */
    :root{
      --safe-top:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
      --safe-bottom:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
    }
    body {
      margin: 0;
      height: 100vh;
      box-sizing: border-box;
      padding: var(--safe-top) 0 var(--safe-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      font-family: -apple-system, sans-serif;
      color: #fff;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #4f9dff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { margin-top: 20px; font-size: 15px; opacity: .8; }
    .error { color: #ff6b6b; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Authenticating with Telegram…</div>

  <script>
    const tg = window.Telegram?.WebApp;

    /*
      Only allow known internal destinations.
      This prevents an arbitrary external URL from being supplied
      through the ?next= parameter.
    */
    function getRedirectDestination() {
      const params = new URLSearchParams(location.search);
      const next = params.get("next");

      if (next === "deposit.html") {
        return "/deposit.html";
      }

      if (next === "refer.html") {
        return "/refer.html";
      }

      if (next === "withdraw.html") {
        return "/withdraw.html";
      }

      return "/dashboard.html";
    }

    async function authenticate() {
      // Must be opened as a Telegram Mini App — initData only exists there.
      if (!tg || !tg.initData) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").innerHTML =
          '<div class="error">Please open this app from the Telegram bot, not a regular browser link.</div>';
        return;
      }

      tg.ready();
      tg.expand();

      try {
        const res = await fetch("/api/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            initData: tg.initData,
            ref: tg.initDataUnsafe?.start_param
              || new URLSearchParams(location.search).get("ref")
              || null
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("msg").innerHTML =
            `<div class="error">${data.message || "Authentication failed."}</div>`;
          return;
        }

        const destination = getRedirectDestination();

        document.getElementById("msg").textContent =
          destination === "/deposit.html"
            ? "Welcome! Opening Deposit…"
            : destination === "/refer.html"
              ? "Welcome! Opening Referrals…"
              : destination === "/withdraw.html"
                ? "Welcome! Opening Withdrawal…"
                : "Welcome! Redirecting…";

        setTimeout(() => {
          location.replace(destination);
        }, 600);

      } catch (err) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").innerHTML =
          '<div class="error">Network error. Please try again.</div>';
      }
    }

    authenticate();
  </script>
</body>
</html>
