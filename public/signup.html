<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#07110c">
  <title>Create Account — Netnaira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --green: #16c784;
      --green-light: #2be59b;
      --bg: #07110c;
      --card: #0d1a13;
      --border: rgba(255,255,255,.08);
      --text: #f4fff8;
      --muted: #84958b;
      --danger: #ff6874;
      --yellow: #f5c451;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      top: -180px;
      right: -140px;
      background: rgba(22,199,132,.11);
      filter: blur(90px);
      border-radius: 50%;
    }

    .container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin: auto auto 12px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--green-light), #0a9e67);
      color: #03150d;
      font-size: 23px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(22,199,132,.18);
    }

    .logo h1 {
      font-size: 22px;
      letter-spacing: -.6px;
    }

    .logo h1 span {
      color: var(--green-light);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 27px 23px;
    }

    .title {
      font-size: 25px;
      letter-spacing: -.8px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .referral-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 12px;
      background: rgba(22,199,132,.08);
      border: 1px solid rgba(22,199,132,.16);
      color: #6ce9b4;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .referral-banner.show {
      display: flex;
    }

    .referral-banner strong {
      color: var(--green-light);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #b8c5bd;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 49px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #09140e;
      color: white;
      padding: 0 14px;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: rgba(22,199,132,.55);
      box-shadow: 0 0 0 3px rgba(22,199,132,.06);
    }

    input::placeholder {
      color: #526159;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #718078;
      cursor: pointer;
      font-size: 12px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: #74837b;
      font-size: 11px;
      line-height: 1.5;
      margin: 4px 0 18px;
    }

    .terms input {
      width: 16px;
      height: 16px;
      min-width: 16px;
      margin-top: 1px;
      accent-color: var(--green);
    }

    .terms a {
      color: var(--green-light);
    }

    button.submit {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: #03150d;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s, opacity .2s;
    }

    button.submit:active {
      transform: scale(.98);
    }

    button.submit:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .message.error {
      display: block;
      background: rgba(255,70,85,.08);
      border: 1px solid rgba(255,70,85,.15);
      color: #ff8790;
    }

    .message.success {
      display: block;
      background: rgba(22,199,132,.08);
      border: 1px solid rgba(22,199,132,.15);
      color: #6ce9b4;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .login a {
      color: var(--green-light);
      font-weight: 700;
    }

    .country {
      color: #718078;
      font-size: 10px;
      text-align: center;
      margin-top: 17px;
    }

    /* ================= RECENT PAYOUTS TICKER ================= */
    /* Scrolls LEFT → RIGHT (opposite of the dashboard ticker) */

    .activity-ticker {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin: 0 0 18px;
      padding: 7px 0;
      border-top: 1px solid rgba(255,255,255,.06);
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(14,28,20,.32);
      border-radius: 10px;
      isolation: isolate;
    }

    .activity-track {
      display: flex;
      width: max-content;
      gap: 12px;
      will-change: transform;
      animation: activity-scroll-ltr 240s linear infinite;
    }

    .activity-item {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 29px;
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      color: #b9c8bf;
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 5px 18px rgba(0,0,0,.10);
    }

    .activity-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--green-light);
      box-shadow: 0 0 9px rgba(39,229,154,.55);
    }

    .activity-label {
      color: #7f9087;
      font-weight: 700;
    }

    .activity-amount {
      color: #e9fff3;
      font-weight: 900;
    }

    .activity-item.premium {
      border-color: rgba(245,196,81,.28);
      background: linear-gradient(90deg, rgba(245,196,81,.055), rgba(255,255,255,.025));
      box-shadow:
        0 0 18px rgba(245,196,81,.12),
        inset 0 0 18px rgba(245,196,81,.025);
    }

    .activity-item.premium .activity-dot {
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(245,196,81,.85);
    }

    .activity-item.premium .activity-amount {
      color: #ffe49a;
      text-shadow: 0 0 9px rgba(245,196,81,.45);
    }

    /* Rare jackpot tier: ₦600,000 – ₦1,500,000 */

    .activity-item.jackpot {
      border-color: rgba(245,196,81,.55);
      background: linear-gradient(90deg, rgba(245,196,81,.14), rgba(255,225,140,.05));
      box-shadow:
        0 0 22px rgba(245,196,81,.30),
        inset 0 0 20px rgba(245,196,81,.06);
      animation: jackpot-pulse 1.8s ease-in-out infinite;
    }

    .activity-item.jackpot .activity-dot {
      background: var(--yellow);
      box-shadow: 0 0 16px rgba(245,196,81,1);
    }

    .activity-item.jackpot .activity-label {
      color: #e8c988;
    }

    .activity-item.jackpot .activity-amount {
      color: #fff2c9;
      text-shadow: 0 0 12px rgba(245,196,81,.75);
    }

    @keyframes jackpot-pulse {
      0%, 100% {
        box-shadow:
          0 0 16px rgba(245,196,81,.25),
          inset 0 0 16px rgba(245,196,81,.05);
      }
      50% {
        box-shadow:
          0 0 30px rgba(245,196,81,.55),
          inset 0 0 24px rgba(245,196,81,.12);
      }
    }

    @keyframes activity-scroll-ltr {
      from { transform: translate3d(-50%,0,0); }
      to   { transform: translate3d(0,0,0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .activity-track {
        animation: none;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">← Back to Netnaira</a>

  <div class="logo">
    <div class="logo-icon">₦</div>
    <h1>Net<span>naira</span></h1>
  </div>

  <!-- ================= RECENT PAYOUTS TICKER ================= -->
  <div class="activity-ticker" aria-label="Recent payout examples">
    <div class="activity-track" id="activityTrack"></div>
  </div>

  <div class="card">

    <h2 class="title">Create your account</h2>

    <p class="subtitle">
      Join Netnaira and manage your earning plans from your personal account.
    </p>

    <div id="referralBanner" class="referral-banner">
      🎉 You were invited by <strong id="referralUsername"></strong>
    </div>

    <div id="message" class="message"></div>

    <form id="signupForm">

      <div class="field">
        <label>Full name</label>
        <input
          id="fullName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label>Username</label>
        <input
          id="username"
          type="text"
          placeholder="Choose a username"
          autocomplete="username"
          minlength="3"
          maxlength="20"
          required
        >
      </div>

      <div class="field">
        <label>Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>

        <div class="input-wrap">
          <input
            id="password"
            type="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('password', this)"
          >
            Show
          </button>
        </div>
      </div>

      <div class="field">
        <label>Confirm password</label>

        <div class="input-wrap">
          <input
            id="confirmPassword"
            type="password"
            placeholder="Enter password again"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('confirmPassword', this)"
          >
            Show
          </button>
        </div>
      </div>

      <label class="terms">
        <input id="terms" type="checkbox" required>

        <span>
          I agree to the Netnaira
          <a href="#">Terms</a>
          and
          <a href="#">Privacy Policy</a>.
        </span>
      </label>

      <button class="submit" id="submitBtn" type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

  </div>

  <div class="country">
    🇳🇬 Built for Nigerians
  </div>

</div>


<script>

  /*
  ================================
  RANDOM PAYOUT TICKER
  ================================

  Generates a fresh, effectively endless set of
  name + action + amount combinations on every
  page load. Amounts are pulled from weighted
  tiers so small payouts show up constantly,
  mid-range payouts show up less often, larger
  payouts are rarer still, and the top tier
  (₦600,000–₦1,500,000) is a rare "jackpot" that
  renders gold and glowing.
  */

  const TICKER_FIRST_NAMES = [
    "Chidinma", "Tunde", "Blessing", "Ibrahim", "Amaka", "Segun",
    "Grace", "Emeka", "Ngozi", "Yusuf", "Funmilayo", "Chukwuemeka",
    "Aisha", "Femi", "Adaeze", "Musa", "Oluwaseun", "Kemi",
    "Chinedu", "Hauwa", "Damilola", "Kelechi", "Zainab", "Bolanle",
    "Uche", "Abdullahi", "Precious", "Olamide", "Nkechi", "Suleiman",
    "Tolu", "Chiamaka", "Faruk", "Ifeoma", "Wale", "Halima",
    "Obinna", "Ronke", "Sadiq", "Ebube", "Yetunde", "Chukwudi",
    "Fatima", "Kayode", "Adaobi", "Bashir", "Temitope", "Nneka",
    "Rasheed", "Omolara"
  ];

  const TICKER_LAST_INITIALS =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const TICKER_ACTIONS = ["received", "withdrew"];

  /*
  Amount tiers, each with a relative weight
  controlling how often it's picked:

    ₦2,500     – ₦50,000      → common
    ₦60,000    – ₦100,000     → less common
    ₦100,000   – ₦500,000     → rarer still
    ₦600,000   – ₦1,500,000   → very rare, gold "jackpot"
  */

  const TICKER_TIERS = [
    { min: 2500,   max: 50000,   weight: 58, jackpot: false },
    { min: 60000,  max: 100000,  weight: 22, jackpot: false },
    { min: 100000, max: 500000,  weight: 15, jackpot: false },
    { min: 600000, max: 1500000, weight: 3,  jackpot: true  }
  ];

  const TICKER_TOTAL_WEIGHT =
    TICKER_TIERS.reduce((sum, tier) => sum + tier.weight, 0);

  function pickTicker(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function pickTickerTier() {
    let roll = Math.random() * TICKER_TOTAL_WEIGHT;

    for (const tier of TICKER_TIERS) {
      if (roll < tier.weight) {
        return tier;
      }
      roll -= tier.weight;
    }

    return TICKER_TIERS[0];
  }

  function randomTickerAmount(tier) {
    const raw =
      tier.min + Math.random() * (tier.max - tier.min);

    // round to a clean-looking figure
    const step = tier.max >= 100000 ? 500 : 50;

    return Math.round(raw / step) * step;
  }

  function formatNaira(amount) {
    return "₦" + amount.toLocaleString("en-NG");
  }

  function buildTickerItem() {
    const firstName = pickTicker(TICKER_FIRST_NAMES);
    const lastInitial = pickTicker(TICKER_LAST_INITIALS);
    const action = pickTicker(TICKER_ACTIONS);
    const tier = pickTickerTier();
    const amount = randomTickerAmount(tier);

    const item = document.createElement("div");
    item.className =
      "activity-item" + (tier.jackpot ? " jackpot" : "");

    item.innerHTML =
      '<span class="activity-dot"></span>' +
      '<span class="activity-label">' +
        firstName + " " + lastInitial + ". " + action +
      '</span>' +
      '<span class="activity-amount">' +
        formatNaira(amount) +
      '</span>';

    return item;
  }

  function renderPayoutTicker() {
    const track = document.getElementById("activityTrack");

    if (!track) {
      return;
    }

    const ITEM_COUNT = 26;
    const fragment = document.createDocumentFragment();
    const items = [];

    for (let i = 0; i < ITEM_COUNT; i++) {
      items.push(buildTickerItem());
    }

    // duplicate the set so the scroll loop is seamless
    items.forEach(item => fragment.appendChild(item));

    items.forEach(item => {
      const clone = item.cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      fragment.appendChild(clone);
    });

    track.appendChild(fragment);
  }

  renderPayoutTicker();


  /*
  ================================
  REFERRAL CODE
  ================================

  Captured once, on page load, from
  ?ref=<username> in the URL. Kept in
  memory for the lifetime of the page
  and sent along with the signup
  request — never re-read from the URL
  again, so it survives even if the
  user edits the address bar afterward.
  */

  const referralCode =
    new URLSearchParams(window.location.search)
      .get("ref")
      ?.trim()
      .toLowerCase() || "";


  if (referralCode) {

    document.getElementById("referralUsername").textContent =
      "@" + referralCode;

    document.getElementById("referralBanner").classList.add("show");

  }


  function togglePassword(id, button) {
    const input = document.getElementById(id);

    if (input.type === "password") {
      input.type = "text";
      button.textContent = "Hide";
    } else {
      input.type = "password";
      button.textContent = "Show";
    }
  }


  function showMessage(text, type) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;
  }


  document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim().toLowerCase();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const terms = document.getElementById("terms").checked;

    const button = document.getElementById("submitBtn");

    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    if (password.length < 8) {
      showMessage("Password must contain at least 8 characters.", "error");
      return;
    }

    if (!terms) {
      showMessage("Please accept the terms and privacy policy.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      const response = await fetch("/api/auth/signup", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fullName,
          username,
          email,
          password,
          ref: referralCode
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || "Unable to create account.");
      }

      showMessage(
        "Account created successfully. Redirecting...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 900);

    } catch (error) {

      showMessage(error.message, "error");

      button.disabled = false;
      button.textContent = "Create Account";
    }

  });

</script>

</body>
</html>
